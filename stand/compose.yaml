# Measurement stand: PostgreSQL 16 (Greenplum dialect via shim + Iceberg JDBC catalog) and Trino 483 on Iceberg.
# Start: cp .env.example .env && docker compose up -d
# The arena evaluator joins the "sqltr" network later and reaches the engines as postgres:5432 and trino:8080.
name: sqltr

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: sqltr_admin
      POSTGRES_PASSWORD: ${SQLTR_PG_ADMIN_PASSWORD:?set it in stand/.env}
      POSTGRES_DB: sqltr
      # byte-order collation like Trino: ordered aggregates and window ORDER BY on text agree
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqltr_admin -d sqltr"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sqltr]
    restart: unless-stopped

  # the trino image runs as uid 1000; a fresh named volume is root-owned, so Iceberg writes would fail
  warehouse-init:
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /data/warehouse/iceberg && chown -R 1000:1000 /data/warehouse"]
    volumes:
      - warehouse:/data/warehouse
    restart: "no"

  trino:
    image: trinodb/trino:483
    depends_on:
      postgres:
        condition: service_healthy
      warehouse-init:
        condition: service_completed_successfully
    environment:
      SQLTR_PG_ADMIN_PASSWORD: ${SQLTR_PG_ADMIN_PASSWORD}
    volumes:
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/rules.json:/etc/trino/rules.json:ro
      - warehouse:/data/warehouse
    ports:
      - "127.0.0.1:8080:8080"
    # jvm.config is the image default with the heap at 60% of this limit (2.4 GB) instead of 80%:
    # measured on the stand, Trino needs about 0.8 GB outside the heap, so at 80% it can reach the limit
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' --user sqltr_admin >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [sqltr]
    restart: unless-stopped

volumes:
  pgdata: {}
  warehouse: {}

networks:
  sqltr:
    name: sqltr
