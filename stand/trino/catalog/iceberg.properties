connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=sqltr
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=sqltr_admin
iceberg.jdbc-catalog.connection-password=${ENV:SQLTR_PG_ADMIN_PASSWORD}
# table locations are resolved inside local.location: local:///iceberg -> /data/warehouse/iceberg
iceberg.jdbc-catalog.default-warehouse-dir=local:///iceberg
fs.local.enabled=true
# a plain filesystem path (validated with Path.of), not a local:// URI
local.location=/data/warehouse
